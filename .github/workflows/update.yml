
name: Update Unified Fanboy Agegate

on:
  workflow_dispatch:
  schedule:
    - cron: "33 7 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge filter lists
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="fanboy_agegate_unified.txt"
          TMP="$(mktemp)"

          trap 'rm -f "$TMP"' EXIT

          printf '%s\n' \
            '! Title: Unified Fanboy Agegate' \
            '! Description: Combined Fanboy Agegate filters' \
            '! Homepage: https://github.com/easylist/easylist' \
            '! Source: EasyList Fanboy Agegate' \
            '' > "$TMP"

          append_list() {
            local name="$1"
            local url="$2"

            echo "! ===== $name =====" >> "$TMP"
            curl -fLsS "$url" >> "$TMP"
            printf '\n\n' >> "$TMP"
          }

          BASE="https://raw.githubusercontent.com/easylist/easylist/refs/heads/master/fanboy-addon"

          append_list "ALLOWLIST" \
            "$BASE/fanboy_agegate_allowlist.txt"

          append_list "GENERAL BLOCK" \
            "$BASE/fanboy_agegate_general_block.txt"

          append_list "GENERAL HIDE" \
            "$BASE/fanboy_agegate_general_hide.txt"

          append_list "SPECIFIC BLOCK" \
            "$BASE/fanboy_agegate_specific_block.txt"

          append_list "SPECIFIC HIDE" \
            "$BASE/fanboy_agegate_specific_hide.txt"

          append_list "SPECIFIC uBO" \
            "$BASE/fanboy_agegate_specific_uBO.txt"

          append_list "THIRD-PARTY" \
            "$BASE/fanboy_agegate_thirdparty.txt"

          mv "$TMP" "$OUTPUT"

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fanboy_agegate_unified.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update unified Fanboy Agegate filters"
            git push
          else
            echo "No changes detected."
          fi
